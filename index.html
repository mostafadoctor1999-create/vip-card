<script>
    function generateVIPCard() {
        var name = document.getElementById('username').value.trim();
        var phone = document.getElementById('phone').value.trim();
        
        if (name === "" || phone === "") {
            alert("برجاء إدخال البيانات أولاً!");
            return;
        }
        
        var part1 = Math.floor(1000 + Math.random() * 9000);
        var part2 = Math.floor(1000 + Math.random() * 9000);
        var part3 = Math.floor(1000 + Math.random() * 9000);
        var cardNumber = "7777 " + part1 + " " + part2 + " " + part3;

        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('vipCard').style.display = 'block';
        document.getElementById('displayHolder').innerText = name;
        document.getElementById('cardNumber').innerText = cardNumber;

        // رابط تطبيق الويب الجديد الذي نسخته حالا من الخطوة السابقة
        var webAppUrl = "ضع_رابط_تطبيق_الويب_الجديد_هنا";

        // إرسال البيانات كنموذج تقليدي آمن ومباشر
        var formData = new FormData();
        formData.append('name', name);
        formData.append('phone', phone);
        formData.append('cardNumber', cardNumber);

        fetch(webAppUrl, {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => console.log("نجح الترحيل التلقائي:", data))
        .catch(error => console.error("خطأ:", error));
    }
</script>
