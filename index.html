<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصر المحمدي - بطاقة الـ VIP الملكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1e1e1e 0%, #050505 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-box {
            background: rgba(20, 20, 20, 0.75);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
        }
        h2 { color: #d4af37; margin-top: 0; font-size: 28px; letter-spacing: 1px; }
        p { color: #b5b5b5; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 22px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: 600; font-size: 15px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 10px;
            background-color: #111;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); outline: none; }
        .gold-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #aa7c11 0%, #d4af37 50%, #f3e5ab 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: 0.3s;
        }
        .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5); }
        .vip-card-display {
            display: none;
            background: linear-gradient(135deg, #1c1a17 0%, #0d0c0a 100%);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            margin-top: 10px;
            text-align: right;
            position: relative;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        .card-brand { color: #d4af37; font-size: 22px; font-weight: bold; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 10px; margin-bottom: 30px; }
        .card-number { font-family: 'Courier New', Courier, monospace; color: #f3e5ab; font-size: 24px; letter-spacing: 2px; text-align: center; margin: 25px 0; direction: ltr; }
        .card-holder { color: #ffffff; font-size: 16px; }
        .card-holder span { color: #d4af37; font-weight: bold; }
        .badge { position: absolute; left: 20px; bottom: 20px; background: rgba(212, 175, 55, 0.15); border: 1px solid #d4af37; color: #d4af37; padding: 4px 12px; font-size: 13px; font-weight: bold; border-radius: 20px; }
    </style>
</head>
<body>

<div class="main-box">
    <div id="formContainer">
        <h2>👑 قصر المحمدي 👑</h2>
        <p>أدخل بياناتك لتوليد بطاقة الـ VIP الملكية فوراً</p>
        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="username" placeholder="مثال: مصطفى محمد أحمد">
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="phone" placeholder="01xxxxxxxxx">
        </div>
        <button class="gold-btn" onclick="startActivation()">تفعيل الكارت الملكي</button>
    </div>

    <div id="vipCard" class="vip-card-display">
        <div class="card-brand">قصر المحمدي • ROYAL PASS</div>
        <div class="card-number" id="cardNumber">7777 0000 0000 0000</div>
        <div class="card-holder">حامل البطاقة: <span id="displayHolder">...</span></div>
        <div class="badge">خصم 10% PREMIUM</div>
    </div>
</div>

<script>
    function startActivation() {
        var clientName = document.getElementById('username').value.trim();
        var clientPhone = document.getElementById('phone').value.trim();
        
        if (clientName === "" || clientPhone === "") {
            alert("برجاء إدخال الاسم ورقم الهاتف أولاً!");
            return;
        }
        
        var p1 = Math.floor(1000 + Math.random() * 9000);
        var p2 = Math.floor(1000 + Math.random() * 9000);
        var p3 = Math.floor(1000 + Math.random() * 9000);
        var generatedNumber = "7777 " + p1 + " " + p2 + " " + p3;

        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('vipCard').style.display = 'block';
        document.getElementById('displayHolder').innerText = clientName;
        document.getElementById('cardNumber').innerText = generatedNumber;

        var finalUrl = https://script.google.com/macros/s/AKfycbxofi3qInQcedHmXy7xWRYGFTUr9eRDwbt5WxV0oMA2D9E1BHnBWGgX20MVxNGBD1Emmg/exec"";

        var packet = new FormData();
        packet.append('name', clientName);
        packet.append('phone', clientPhone);
        packet.append('cardNumber', generatedNumber);

        fetch(finalUrl, {
            method: "POST",
            mode: "no-cors", 
            body: packet
        })
        .then(function() {
            console.log("تم الترحيل بنجاح.");
        })
        .catch(function(err) {
            console.error("خطأ:", err);
        });
    }
</script>

</body>
</html>
