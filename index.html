<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصر المحمدي - بطاقة الـ VIP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .main-box {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #f39c12;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }
        .gold-btn {
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            color: #1a1a1a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .vip-card-display {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border-radius: 10px;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <div id="formContainer">
            <h2>قصر المحمدي</h2>
            <p>النخبة الملكية VIP! أدخل بياناتك لتفعيل بطاقة الكرم</p>
            
            <div class="form-group">
                <label>الاسم بالكامل:</label>
                <input type="text" id="username" placeholder="مصطفى محمد أحمد">
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxx">
            </div>
            
            <button class="gold-btn" onclick="startActivation()">تفعيل الكارت الملكي VIP</button>
        </div>

        <div id="vipCard" class="vip-card-display">
            <div>ROYAL PASS • قصر المحمدي</div>
            <div id="cardNumber" style="margin: 20px 0; font-size: 18px;">7777 0000 0000 0000</div>
            <div>حامل البطاقة: <span id="displayHolder"></span></div>
            <div style="font-size: 12px; margin-top: 10px;">PREMIUM MEMBER 10% OFF</div>
        </div>
    </div>

<script>
function startActivation() {
    var clientName = document.getElementById('username').value.trim();
    var clientPhone = document.getElementById('phone').value.trim();

    if (clientName === "" || clientPhone === "") {
        alert("برجاء إدخال الاسم ورقم الهاتف أولاً!");
        return;
    }

    // توليد رقم بطاقة عشوائي مميز للعميل VIP
    var p1 = Math.floor(1000 + Math.random() * 9000);
    var p2 = Math.floor(1000 + Math.random() * 9000);
    var p3 = Math.floor(1000 + Math.random() * 9000);
    var generatedNumber = "7777 " + p1 + " " + p2 + " " + p3;

    // تحويل الكارت الفوري أمام العميل أولاً بدون تأخير لضمان تجربة ممتازة
    document.getElementById('formContainer').style.display = 'none';
    document.getElementById('vipCard').style.display = 'block';
    document.getElementById('displayHolder').innerText = clientName;
    document.getElementById('cardNumber').innerText = generatedNumber;

    // ضع رابط الـ Webhook الخاص بمنصة Make هنا بين علامتي التنصيص
    var finalUrl = "https://hook.eu1.make.com/etz3opkf30gn2f9x9exoxs63799rvfxx";

    // محاولة جلب اللوكيشن بشكل مرن: إذا وافق العميل يرسل الموقع، وإذا رفض يرسل البيانات بدونه فوراً
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                var locationUrl = "https://google.com" + lat + "," + lng;
                // إرسال البيانات مع اللوكيشن
                sendData(finalUrl, clientName, clientPhone, generatedNumber, locationUrl);
            },
            function(error) {
                // في حال رفض صلاحية الموقع أو حدوث خطأ، يتم الإرسال بدونه فوراً لضمان عدم تعطل السيستم
                sendData(finalUrl, clientName, clientPhone, generatedNumber, "مرفوض أو غير متاح");
            },
            { timeout: 5000 } // وقت أقصى لجلب الموقع 5 ثوانٍ لتفادي التعليق
        );
    } else {
        // المتصفح لا يدعم اللوكيشن، أرسل البيانات مباشرة
        sendData(finalUrl, clientName, clientPhone, generatedNumber, "غير مدعوم");
    }
}

function sendData(url, name, phone, cardNumber, location) {
    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: name,
            phone: phone,
            cardNumber: cardNumber,
            location: location,
            date: new Date().toISOString()
        })
    })
    .then(response => {
        console.log("Data sent successfully to Make!");
    })
    .catch(error => {
        console.error("Error sending data:", error);
    });
}
</script>

</body>
</html>
